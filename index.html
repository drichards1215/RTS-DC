<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>D.C. Public Art &amp; Statues Database</title>

  <!-- Leaflet Map CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />

  <style>
    :root {
      --bg: #f6f8fa;
      --card: #ffffff;
      --text: #1f2328;
      --muted: #656d76;
      --border: #d0d7de;
      --accent: #0969da;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 900px;
      margin: 28px auto;
      padding: 0 16px;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    header {
      margin-bottom: 18px;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 1.65rem;
    }
    .subtitle {
      margin: 0;
      color: var(--muted);
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
    }
    input, select {
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      background: var(--card);
    }
    input {
      flex: 2;
      min-width: 220px;
    }
    select {
      flex: 1;
      min-width: 180px;
    }
    #map {
      height: 380px;
      width: 100%;
      border-radius: 10px;
      border: 1px solid var(--border);
      margin-bottom: 14px;
      z-index: 1;
    }
    .count {
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 12px;
    }
    .grid {
      display: grid;
      gap: 16px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      display: grid;
      grid-template-columns: 240px 1fr;
    }
    .card.no-image {
      grid-template-columns: 1fr;
    }
    @media (max-width: 660px) {
      .card {
        grid-template-columns: 1fr;
      }
    }
    .card-media {
      background: #eaeef2;
      display: flex;
      flex-direction: column;
    }
    .card-media img {
      width: 100%;
      height: 100%;
      min-height: 190px;
      max-height: 260px;
      object-fit: cover;
      display: block;
    }
    .photo-credit {
      font-size: 0.75rem;
      color: var(--muted);
      padding: 4px 8px;
      background: #f6f8fa;
      border-top: 1px solid var(--border);
    }
    .card-body {
      padding: 18px;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
      flex-wrap: wrap;
    }
    .card h2 {
      margin: 0;
      font-size: 1.2rem;
    }
    .badge {
      font-size: 0.8rem;
      padding: 2px 8px;
      border-radius: 999px;
      background: #ddf4ff;
      color: var(--accent);
      font-weight: 600;
    }
    .meta {
      margin: 6px 0 10px;
      font-size: 0.9rem;
      color: var(--muted);
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 10px;
      align-items: center;
    }
    .map-link, .focus-btn {
      color: var(--accent);
      font-size: 0.92rem;
      font-weight: 500;
      text-decoration: none;
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      font-family: inherit;
    }
    .map-link:hover, .focus-btn:hover {
      text-decoration: underline;
    }
    .popup-img {
      width: 100%;
      max-height: 130px;
      object-fit: cover;
      border-radius: 6px;
      margin: 6px 0;
      display: block;
    }
  </style>
</head>
<body>
  <header>
    <h1>Washington, D.C. Public Art &amp; Statues</h1>
    <p class="subtitle">Interactive map and searchable catalog of monuments, sculptures, and outdoor art across the District.</p>
  </header>

  <div class="controls">
    <input id="searchInput" type="search" placeholder="Search by name, artist, material, or keyword..." />
    <select id="neighborhoodFilter">
      <option value="">All Neighborhoods / Areas</option>
    </select>
  </div>

  <div id="map" aria-label="Interactive map of Washington D.C. statues"></div>

  <div id="resultCount" class="count">Loading database...</div>
  <div id="artList" class="grid"></div>

  <!-- Leaflet Map JS -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <script>
    let allArtworks = [];
    const markersById = {};

    const searchInput = document.getElementById("searchInput");
    const neighborhoodFilter = document.getElementById("neighborhoodFilter");
    const resultCount = document.getElementById("resultCount");
    const artList = document.getElementById("artList");

    // Initialize Leaflet map centered on Washington, D.C.
    const map = L.map("map").setView([38.8895, -77.0353], 13);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    const markerLayer = L.layerGroup().addTo(map);

    async function loadDatabase() {
      try {
        const response = await fetch("./artworks.json");
        if (!response.ok) throw new Error("Failed to load artworks.json");
        allArtworks = await response.json();
        populateNeighborhoods(allArtworks);
        renderArtworks();
      } catch (err) {
        resultCount.textContent = "Error loading database. Check that artworks.json is valid JSON.";
        console.error(err);
      }
    }

    function populateNeighborhoods(items) {
      const areas = [...new Set(items.map(item => item.neighborhood))].sort();
      areas.forEach(area => {
        const option = document.createElement("option");
        option.value = area;
        option.textContent = area;
        neighborhoodFilter.appendChild(option);
      });
    }

    function buildPopupContent(item) {
      const wrapper = document.createElement("div");
      wrapper.style.maxWidth = "220px";

      const title = document.createElement("strong");
      title.textContent = `${item.title} (${item.year})`;
      wrapper.appendChild(title);

      const artist = document.createElement("div");
      artist.style.fontSize = "0.85rem";
      artist.style.color = "#555";
      artist.textContent = item.artist;
      wrapper.appendChild(artist);

      if (item.image) {
        const img = document.createElement("img");
        img.src = item.image;
        img.alt = item.title;
        img.className = "popup-img";
        img.onerror = () => img.remove();
        wrapper.appendChild(img);
      }

      const loc = document.createElement("div");
      loc.style.fontSize = "0.82rem";
      loc.style.marginTop = "4px";
      loc.textContent = item.location;
      wrapper.appendChild(loc);

      return wrapper;
    }

    function renderArtworks() {
      const query = searchInput.value.trim().toLowerCase();
      const selectedArea = neighborhoodFilter.value;

      const filtered = allArtworks.filter(item => {
        const matchesArea = !selectedArea || item.neighborhood === selectedArea;
        const searchableText = [
          item.title,
          item.artist,
          item.material,
          item.neighborhood,
          item.location,
          item.description,
          String(item.year)
        ].join(" ").toLowerCase();

        return matchesArea && searchableText.includes(query);
      });

      resultCount.textContent = `Showing ${filtered.length} of ${allArtworks.length} entries`;
      artList.innerHTML = "";
      markerLayer.clearLayers();
      Object.keys(markersById).forEach(key => delete markersById[key]);

      const bounds = [];

      filtered.forEach(item => {
        // 1. Add Map Marker
        if (typeof item.lat === "number" && typeof item.lng === "number") {
          const marker = L.marker([item.lat, item.lng])
            .bindPopup(buildPopupContent(item))
            .addTo(markerLayer);
          markersById[item.id] = marker;
          bounds.push([item.lat, item.lng]);
        }

        // 2. Build Card
        const card = document.createElement("article");
        card.className = item.image ? "card" : "card no-image";

        if (item.image) {
          const media = document.createElement("div");
          media.className = "card-media";

          const img = document.createElement("img");
          img.src = item.image;
          img.alt = `${item.title} in Washington, D.C.`;
          img.loading = "lazy";
          img.onerror = () => {
            media.remove();
            card.classList.add("no-image");
          };
          media.appendChild(img);

          if (item.image_credit) {
            const credit = document.createElement("div");
            credit.className = "photo-credit";
            credit.textContent = `Photo: ${item.image_credit}`;
            media.appendChild(credit);
          }

          card.appendChild(media);
        }

        const body = document.createElement("div");
        body.className = "card-body";

        const header = document.createElement("div");
        header.className = "card-header";

        const title = document.createElement("h2");
        title.textContent = `${item.title} (${item.year})`;

        const badge = document.createElement("span");
        badge.className = "badge";
        badge.textContent = item.neighborhood;

        header.append(title, badge);

        const meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = `Artist: ${item.artist} • Material: ${item.material} • Height: ${item.height_ft} ft`;

        const desc = document.createElement("p");
        desc.textContent = item.description;

        const actions = document.createElement("div");
        actions.className = "actions";

        if (markersById[item.id]) {
          const focusBtn = document.createElement("button");
          focusBtn.type = "button";
          focusBtn.className = "focus-btn";
          focusBtn.textContent = "🗺️ Focus on map";
          focusBtn.addEventListener("click", () => {
            document.getElementById("map").scrollIntoView({ behavior: "smooth", block: "center" });
            map.setView([item.lat, item.lng], 16);
            markersById[item.id].openPopup();
          });
          actions.appendChild(focusBtn);
        }

        const mapLink = document.createElement("a");
        mapLink.className = "map-link";
        mapLink.href = `https://www.google.com/maps/search/?api=1&query=${item.lat},${item.lng}`;
        mapLink.target = "_blank";
        mapLink.rel = "noopener noreferrer";
        mapLink.textContent = `📍 Open in Google Maps (${item.location}) ↗`;
        actions.appendChild(mapLink);

        body.append(header, meta, desc, actions);
        card.appendChild(body);
        artList.appendChild(card);
      });

      // Auto-fit map bounds to visible pins
      if (bounds.length > 1) {
        map.fitBounds(bounds, { padding: [35, 35] });
      } else if (bounds.length === 1) {
        map.setView(bounds[0], 15);
      }
    }

    searchInput.addEventListener("input", renderArtworks);
    neighborhoodFilter.addEventListener("change", renderArtworks);

    loadDatabase();
  </script>
</body>
</html>
