<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>D.C. Public Art &amp; Statues Database</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
  <style>
    :root {
      --bg: #f6f8fa;
      --card: #ffffff;
      --text: #1f2328;
      --muted: #656d76;
      --border: #d0d7de;
      --accent: #0969da;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 900px;
      margin: 28px auto;
      padding: 0 16px;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .site-title {
      text-align: center;
      margin-bottom: 20px;
    }
    .site-title .name {
      margin: 0;
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .site-title .place {
      margin: 2px 0 0;
      font-size: 1.15rem;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    nav {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }
    nav a {
      text-decoration: none;
      color: var(--text);
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 6px;
    }
    nav a:hover {
      background: #eaeef2;
    }
    nav a.active {
      background: #ddf4ff;
      color: var(--accent);
    }
    header {
      margin-bottom: 18px;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 1.65rem;
    }
    .subtitle {
      margin: 0;
      color: var(--muted);
    }
    .map-embed-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      min-height: 360px;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 16px;
      background: var(--card);
    }
    .map-embed-wrap iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
    }
    input, select {
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      background: var(--card);
      color: var(--text);
    }
    input {
      flex: 2;
      min-width: 220px;
    }
    select {
      flex: 1;
      min-width: 180px;
    }
    .count {
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 12px;
    }
    .grid {
      display: grid;
      gap: 16px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      display: grid;
      grid-template-columns: 240px 1fr;
    }
    .card.no-image {
      grid-template-columns: 1fr;
    }
    @media (max-width: 660px) {
      .card {
        grid-template-columns: 1fr;
      }
    }
    .card-media {
      background: #eaeef2;
      display: flex;
      flex-direction: column;
    }
    .card-media img {
      width: 100%;
      height: 100%;
      min-height: 190px;
      max-height: 260px;
      object-fit: cover;
      display: block;
    }
    .photo-credit {
      font-size: 0.75rem;
      color: var(--muted);
      padding: 4px 8px;
      background: #f6f8fa;
      border-top: 1px solid var(--border);
    }
    .card-body {
      padding: 18px;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
      flex-wrap: wrap;
    }
    .card h2 {
      margin: 0;
      font-size: 1.2rem;
    }
    .badge {
      font-size: 0.8rem;
      padding: 2px 8px;
      border-radius: 999px;
      background: #ddf4ff;
      color: var(--accent);
      font-weight: 600;
    }
    .meta {
      margin: 6px 0 10px;
      font-size: 0.9rem;
      color: var(--muted);
    }
    .map-link {
      display: inline-block;
      margin-top: 8px;
      color: var(--accent);
      font-size: 0.92rem;
      font-weight: 500;
      text-decoration: none;
    }
    .map-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="site-title">
    <p class="name">Romancing the Stone</p>
    <p class="place">Washington, DC</p>
  </div>

  <nav aria-label="Site navigation">
    <a href="./index.html" class="active">Map &amp; Catalog</a>
    <a href="./instagram.html">Instagram (@romancingthestonedc)</a>
  </nav>

  <header>
    <h1>Washington, D.C. Public Art &amp; Statues</h1>
    <p class="subtitle">Embedded map and searchable catalog of monuments, sculptures, and outdoor art across the District.</p>
  </header>

  <div class="map-embed-wrap">
    <iframe
      src="https://www.google.com/maps/d/embed?mid=1Ct2PzuSYKYIbhtWQBRulAs7N7hEk0RbG&ehbc=2E312F"
      width="640"
      height="480"
      style="border: 0;"
      loading="lazy"
      referrerpolicy="no-referrer-when-downgrade"
      title="Washington, D.C. Public Art &amp; Statues Map">
    </iframe>
  </div>

  <div class="controls">
    <input id="searchInput" type="search" placeholder="Search by name, artist, material, or keyword..." />
    <select id="neighborhoodFilter">
      <option value="">All Neighborhoods / Areas</option>
    </select>
  </div>

  <div id="resultCount" class="count">Loading database...</div>
  <div id="artList" class="grid"></div>

  <script>
    let allArtworks = [];

    const searchInput = document.getElementById("searchInput");
    const neighborhoodFilter = document.getElementById("neighborhoodFilter");
    const resultCount = document.getElementById("resultCount");
    const artList = document.getElementById("artList");

    async function loadDatabase() {
      try {
        const response = await fetch("./artworks.json");
        if (!response.ok) throw new Error("Failed to load artworks.json");
        allArtworks = await response.json();
        populateNeighborhoods(allArtworks);
        renderArtworks();
      } catch (err) {
        resultCount.textContent = "Error loading database. Check that artworks.json is valid JSON.";
        console.error(err);
      }
    }

    function populateNeighborhoods(items) {
      const areas = [...new Set(items.map(item => item.neighborhood))].sort();
      areas.forEach(area => {
        const option = document.createElement("option");
        option.value = area;
        option.textContent = area;
        neighborhoodFilter.appendChild(option);
      });
    }

    function renderArtworks() {
      const query = searchInput.value.trim().toLowerCase();
      const selectedArea = neighborhoodFilter.value;

      const filtered = allArtworks.filter(item => {
        const matchesArea = !selectedArea || item.neighborhood === selectedArea;
        const searchableText = [
          item.title,
          item.artist,
          item.material,
          item.neighborhood,
          item.location,
          item.description,
          String(item.year)
        ].join(" ").toLowerCase();

        return matchesArea && searchableText.includes(query);
      });

      resultCount.textContent = `Showing ${filtered.length} of ${allArtworks.length} entries`;
      artList.innerHTML = "";

      filtered.forEach(item => {
        const card = document.createElement("article");
        card.className = item.image ? "card" : "card no-image";

        if (item.image) {
          const media = document.createElement("div");
          media.className = "card-media";

          const img = document.createElement("img");
          img.src = item.image;
          img.alt = `${item.title} in Washington, D.C.`;
          img.loading = "lazy";
          img.onerror = () => {
            media.remove();
            card.classList.add("no-image");
          };
          media.appendChild(img);

          if (item.image_credit) {
            const credit = document.createElement("div");
            credit.className = "photo-credit";
            credit.textContent = `Photo: ${item.image_credit}`;
            media.appendChild(credit);
          }

          card.appendChild(media);
        }

        const body = document.createElement("div");
        body.className = "card-body";

        const header = document.createElement("div");
        header.className = "card-header";

        const title = document.createElement("h2");
        title.textContent = `${item.title} (${item.year})`;

        const badge = document.createElement("span");
        badge.className = "badge";
        badge.textContent = item.neighborhood;

        header.append(title, badge);

        const meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = `Artist: ${item.artist} • Material: ${item.material} • Height: ${item.height_ft} ft`;

        const desc = document.createElement("p");
        desc.textContent = item.description;

        const mapLink = document.createElement("a");
        mapLink.className = "map-link";
        mapLink.href = `https://www.google.com/maps/search/?api=1&query=${item.lat},${item.lng}`;
        mapLink.target = "_blank";
        mapLink.rel = "noopener noreferrer";
        mapLink.textContent = `📍 Open in Google Maps (${item.location}) ↗`;

        body.append(header, meta, desc, mapLink);
        card.appendChild(body);
        artList.appendChild(card);
      });
    }

    searchInput.addEventListener("input", renderArtworks);
    neighborhoodFilter.addEventListener("change", renderArtworks);

    loadDatabase();
  </script>
</body>
</html>
